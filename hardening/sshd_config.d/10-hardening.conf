# SdWa5 VPS SSH hardening, 2026-09-07.
#
# sshd uses the FIRST occurrence of a keyword, and the Include sits at line 12 of
# sshd_config, so the values here win over sshd_config and over any drop-in that
# sorts later. Until 2026-10-24 that drop-in was cloud-init's 50-cloud-init.conf
# with PasswordAuthentication yes; cloud-init and the file are gone since, and
# this file keeps its 10- prefix so a future drop-in cannot override it.
#
# Reason: 13,672 failed root logins in 24 hours, escalating to several hundred
# attempts per minute, against a host that also had a sudo-capable "admin" account
# with a password and no key. The flood additionally pushed sshd past MaxStartups
# and started dropping legitimate connections.
#
# Fallback if the key is ever lost is the Contabo console, which uses getty and PAM
# and is unaffected by anything in this file.
PasswordAuthentication no
PermitRootLogin prohibit-password
KbdInteractiveAuthentication no

# Only the one key file. The default also reads .ssh/authorized_keys2, a legacy
# file nothing here uses and a quiet place to leave a key behind. root's keys are
# checked hourly against an allowlist, see monitoring/account-check.sh.
AuthorizedKeysFile .ssh/authorized_keys

# Raised from the 10:30:100 default. The flood keeps dozens of connections in the
# pre-auth phase, and at the default sshd begins dropping new ones at 10.
MaxStartups 30:50:200

# Only these two accounts may log in, 2026-11-05. All 274 logins of the previous
# 30 days were root with a key. relay is the port-forwarding account for the home
# machines below. TODO #30 proposed AllowUsers root; this is that list plus relay.
AllowUsers root relay

# The relay account for the home machines, see docs/ssh-hardening.md "Relay for the
# home machines". Its keys live in a host-only file, one line per key with its own
# permitlisten or permitopen. This block is the ceiling for every line in it: the
# two loopback ports and nothing else. ClientAlive drops a vanished laptop within
# 45 s, which frees its port for the reconnect.
#
# A Match block runs to the end of the file it starts in, so it must stay last here.
Match User relay
    AuthorizedKeysFile /etc/ssh/relay_authorized_keys
    PermitListen localhost:2201 localhost:2202
    PermitOpen 127.0.0.1:2201 127.0.0.1:2202
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
    ClientAliveInterval 15
    ClientAliveCountMax 3
