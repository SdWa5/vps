name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# **A superseded push should stop costing money the moment it is superseded.** This repository's runs are cheap,
# about a minute, so the saving here is small — it is in place because the rule should be the same in all three
# SdWa5 repositories rather than because this one is expensive. `sdwa5-3d` is where it pays for itself.
#
# **`cancel-in-progress` is off on `main` on purpose.** A merge commit's green run is the thing a release is
# judged by, and cancelling it because the next merge landed is how a branch ends up with no completed run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # tests/run.sh runs bats and shellcheck inside containers, so the runner needs
  # nothing installed beyond the Docker it already has. Running the script
  # rather than reimplementing it here keeps CI and a local run identical.
  tests:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. That default is what let `sdwa5-3d`'s `full` job burn roughly 1644 minutes
    # across three nightly runs before anybody saw a log, because a job cancelled at the ceiling reports only that
    # it was cancelled. Two Docker pulls and 155 bats tests have no business anywhere near ten minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - run: tests/run.sh

  # NOTE, 2026-09-14: this runs now. The note that stood here said nothing in any of the three SdWa5
  # repositories had ever executed, because every run failed within seconds with "The job was not
  # started because recent account payments have failed or your spending limit needs to be
  # increased", measured 2026-09-08. Runs complete from 2026-09-13 onwards, so this pipeline is
  # verified on GitHub rather than only locally. The repositories are still private, so the minutes
  # are still metered and the runner still has two cores where a public one has four. See the
  # go-public item in the root repository's TODO.md.

  # Secret scanning, on the working tree and on the full history.
  #
  # The gitleaks CLI is used directly rather than gitleaks/gitleaks-action,
  # because that action requires a paid-tier licence key for repositories owned
  # by a GitHub Organization, and moving these repositories into an `sdwa5`
  # organization is the plan. The CLI itself is MIT and needs no key.
  #
  # This repository is the reason the check exists. Two real secrets were
  # committed in c516d41 and only found on 2026-09-08, by which time they had
  # been in the history for weeks. See docs/minecraft.md.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          # The history scan needs the history.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the working tree
        run: /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml

      - name: Scan the full history
        run: /tmp/gitleaks git . --redact --no-banner --config .gitleaks.toml
