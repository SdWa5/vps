; Mitigation for the PHP security release of 2026-10-21 (CVE-2026-109618, GHSA-w8hw-w9fx-j79w, and
; CVE-2026-109619, GHSA-6wmf-4rv5-p3rp). Mounted read-only into every PHP web service, see
; docs/maintenance.md#php-85.
;
; It stays after patching, because the upload progress feature is unused here and removing it
; narrows the multipart and session code a future bug can reach. fatal_error_backtraces exists from
; PHP 8.5 on; older versions ignore the unknown key, so the file needs no variant per version.
; memory_limit=-1 is deliberately not set.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
