# Update proposals only, see docs/maintenance.md#update-proposals. Merging a pull request deploys
# nothing, because production pulls by hand, and a Shopware, Dolibarr or database bump still goes
# through its rehearsal before anybody merges it.
version: 2
updates:
  # Both compose files in the root, with their tag and tag@sha256 pins. Services on :latest are
  # skipped, since there is no version to compare. The updater edits the raw text, so every image
  # is written out on its service rather than shared through a YAML anchor.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # A MariaDB major version upgrades the data files in place and cannot be undone.
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]
      # The same holds for MySQL.
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      # The shop image is built here and in no registry (docs/shopware/image.md).
      - dependency-name: localhost/sdwa5-shopware

  # The shop image's base and build images, pinned by digest. A new digest arrives as a pull
  # request, and merging it deploys nothing until the image is rebuilt and shipped
  # (docs/shopware/image.md#tags).
  - package-ecosystem: docker
    directory: /shopware
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # The workflow's actions, pinned to commits with the version as a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
