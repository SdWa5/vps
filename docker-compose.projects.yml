version: '3'

# YAML anchors do not cross files, so this repeats the x-logging anchor from
# docker-compose.yml rather than referencing it. Without a logging cap a
# container's json-file log grows without bound, which is what filled the disk
# in July 2026.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  project2_dolibarr_db:
    # Same pin as docker-compose.yml. Minor series rather than exact, so
    # patches inside 12.3 still arrive and a major-version jump cannot.
    image: mariadb:12.3
    container_name: project2_dolibarr_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${PROJECT2_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PROJECT2_MYSQL_DATABASE:-dolidb}
      MYSQL_USER: ${PROJECT2_MYSQL_USER:-dolidbuser}
      MYSQL_PASSWORD: ${PROJECT2_MYSQL_PASSWORD}
    volumes:
      - ./project2-dolibarr-mariadb-data:/var/lib/mysql

  project2_dolibarr:
    # Same exact pin as docker-compose.yml, for the same reason: Dolibarr
    # minor upgrades run forward-only database migrations.
    image: dolibarr/dolibarr:23.0.2
    container_name: project2_dolibarr
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOLI_INIT_DEMO: ${PROJECT2_INIT_DEMO:-0}
      DOLI_DB_HOST: project2_dolibarr_db
      DOLI_DB_NAME: ${PROJECT2_MYSQL_DATABASE:-dolidb}
      DOLI_DB_USER: ${PROJECT2_MYSQL_USER:-dolidbuser}
      DOLI_DB_PASSWORD: ${PROJECT2_MYSQL_PASSWORD}
      DOLI_URL_ROOT: "https://project2.sdwa5.org"
      DOLI_ADMIN_LOGIN: "${PROJECT2_ADMIN_LOGIN:-admin}"
      DOLI_ADMIN_PASSWORD: "${PROJECT2_ADMIN_PASSWORD}"
      DOLI_CRON: ${PROJECT2_CRON:-0}
      DOLI_CRON_KEY: ${PROJECT2_CRON_KEY}
      DOLI_COMPANY_NAME: ${PROJECT2_COMPANY_NAME:-Project 2}
      WWW_USER_ID: ${PROJECT2_WWW_USER_ID:-1000}
      WWW_GROUP_ID: ${PROJECT2_WWW_GROUP_ID:-1000}
    ports:
      - "127.0.0.1:8003:80"
    links:
      - project2_dolibarr_db
    volumes:
      - ./project2-dolibarr-documents-data:/var/www/documents
      - ./project2-dolibarr-custom-data:/var/www/html/custom

  project3_dolibarr_db:
    # Same pin as docker-compose.yml. Minor series rather than exact, so
    # patches inside 12.3 still arrive and a major-version jump cannot.
    image: mariadb:12.3
    container_name: project3_dolibarr_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${PROJECT3_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PROJECT3_MYSQL_DATABASE:-dolidb}
      MYSQL_USER: ${PROJECT3_MYSQL_USER:-dolidbuser}
      MYSQL_PASSWORD: ${PROJECT3_MYSQL_PASSWORD}
    volumes:
      - ./project3-dolibarr-mariadb-data:/var/lib/mysql

  project3_dolibarr:
    # Same exact pin as docker-compose.yml, for the same reason: Dolibarr
    # minor upgrades run forward-only database migrations.
    image: dolibarr/dolibarr:23.0.2
    container_name: project3_dolibarr
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOLI_INIT_DEMO: ${PROJECT3_INIT_DEMO:-0}
      DOLI_DB_HOST: project3_dolibarr_db
      DOLI_DB_NAME: ${PROJECT3_MYSQL_DATABASE:-dolidb}
      DOLI_DB_USER: ${PROJECT3_MYSQL_USER:-dolidbuser}
      DOLI_DB_PASSWORD: ${PROJECT3_MYSQL_PASSWORD}
      DOLI_URL_ROOT: "https://project3.sdwa5.org"
      DOLI_ADMIN_LOGIN: "${PROJECT3_ADMIN_LOGIN:-admin}"
      DOLI_ADMIN_PASSWORD: "${PROJECT3_ADMIN_PASSWORD}"
      DOLI_CRON: ${PROJECT3_CRON:-0}
      DOLI_CRON_KEY: ${PROJECT3_CRON_KEY}
      DOLI_COMPANY_NAME: ${PROJECT3_COMPANY_NAME:-Project 3}
      WWW_USER_ID: ${PROJECT3_WWW_USER_ID:-1000}
      WWW_GROUP_ID: ${PROJECT3_WWW_GROUP_ID:-1000}
    ports:
      - "127.0.0.1:8004:80"
    links:
      - project3_dolibarr_db
    volumes:
      - ./project3-dolibarr-documents-data:/var/www/documents
      - ./project3-dolibarr-custom-data:/var/www/html/custom

  chimodiazz_shopware:
    # Same exact pin as the sdwa5.org instance in docker-compose.yml, and for the
    # same reason: the `6.7-latest` tag that does exist rolls across minor
    # versions, and a Shopware minor runs forward-only database migrations.
    # Holding both instances on one version also means a Shopware upgrade is one
    # deliberate decision rather than two drifting ones.
    image: dockware/shopware:6.7.11.1
    container_name: chimodiazz_shopware
    # Profile-gated on purpose. As of 2026-09-15 chimodiazz/website has no
    # deployable application yet, so this service is defined but must not start:
    # a bare `docker-compose -f docker-compose.projects.yml up -d` would otherwise
    # bring up an empty shop with dockware's default credentials on a public
    # subdomain. Start it deliberately with `--profile chimodiazz` once the site
    # exists, and change those credentials in the same sitting.
    profiles: ["chimodiazz"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - SHOP_DOMAIN=chimodiazz.sdwa5.org
      - APP_URL=https://chimodiazz.sdwa5.org
    ports:
      # Loopback only, like every other published port here. Caddy terminates TLS
      # and reaches 8444, mirroring how sdwa5.org reaches its own container.
      - "127.0.0.1:8005:80"
      - "127.0.0.1:8444:443"
    volumes:
      - ./chimodiazz-mysql-data:/var/lib/mysql
      - ./chimodiazz-html-data:/var/www/html
      # The theme plugin is not owned by this repository. It lives in
      # chimodiazz/website, which the host checks out to ./chimodiazz-src using
      # its own read-only deploy key, and it is mounted rather than copied so a
      # `git pull` in that checkout is the whole update. Read-write on purpose:
      # Shopware's storefront build writes into the plugin's own dist directory,
      # which a read-only mount would break.
      - ./chimodiazz-src/shopware/custom/plugins/ChimodiazzTheme:/var/www/html/custom/plugins/ChimodiazzTheme
