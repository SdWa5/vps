# Secret scanning configuration for sdwa5-vps.
#
# Extends the upstream rule set rather than replacing it, so new rules arrive
# with a gitleaks upgrade instead of having to be copied in here.
[extend]
useDefault = true

[[allowlists]]
description = "Shopware plugin hash manifests, which are not secrets"
# checksum.json is {"algorithm": ..., "hashes": {filename: digest, ...}}. Every
# value is a fixed-length hex digest, so the generic high-entropy rule flags ten
# of them. The file is store-installed plugin content, tracked because those
# plugins are not managed through composer.
#
# **SCOPED TO THE RULE RATHER THAN TO THE PATH, AND THAT DISTINCTION IS THE
# POINT.** A bare `paths` entry makes gitleaks skip reading the file at all,
# which would also blind the scan to a secret arriving there in future. That is
# exactly the defect found in sdwa5-3d on 2026-09-14, where an allowlist
# exempted four tracked files while its own comment claimed nothing there was
# committed. Measured on 2026-09-15 with a planted key: without any allowlist the
# file yields eleven findings, with this one it still yields the planted key and
# loses only the ten digests.
targetRules = ["generic-api-key"]
paths = ['''^shopware-html-data/custom/plugins/[^/]+/checksum\.json$''']

# **THE COMMIT ALLOWLIST IS GONE, BECAUSE WHAT IT HID IS GONE.** It exempted the
# commit that imported `minecraft-data/server.properties`, which carried two
# machine-generated secrets. That file was removed from the entire history on
# 2026-09-15, so there is nothing left to exempt and no commit hash to keep in
# step with the next rewrite.
