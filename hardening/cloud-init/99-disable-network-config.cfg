# Deployed to /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg.
#
# cloud-init ran at the first Debian 13 boot on 2026-10-15 despite /etc/cloud/cloud-init.disabled and
# rewrote /etc/netplan/50-cloud-init.yaml without the static IPv6 address. With network config
# disabled it leaves netplan alone even when it runs.
network: {config: disabled}
