version: '3.9'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Settings both Paperless-ngx instances share, merged into each app's
# environment. One worker of each kind, so OCR cannot starve the two shops on
# four cores. No directory consumer, because no scanner or phone reaches a
# folder on this host; documents arrive by web or app upload, where the
# uploader becomes the owner. AI stays off (TODO.md). See docs/paperless.md.
x-paperless-env: &paperless-env
  PAPERLESS_DBENGINE: mariadb
  PAPERLESS_DBPORT: 3306
  PAPERLESS_OCR_LANGUAGE: deu+eng
  PAPERLESS_TIME_ZONE: Europe/Berlin
  PAPERLESS_TASK_WORKERS: 1
  PAPERLESS_THREADS_PER_WORKER: 1
  PAPERLESS_WEBSERVER_WORKERS: 1
  PAPERLESS_CONSUMER_DISABLE: "true"
  PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
  USERMAP_UID: 1000
  USERMAP_GID: 1000

services:
  vaultwarden:
    # Deliberately NOT pinned. monitoring/vaultwarden-autoupdate.sh pulls this
    # weekly and verifies the result, and a pin would silently freeze security
    # updates for a password vault. See docs/vaultwarden.md.
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.sdwa5.org
      # An argon2id PHC hash of the admin token, not the token, so it may stay a
      # value (measured 2026-10-16). The /admin page is blocked at Caddy anyway.
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    logging: *default-logging
    volumes:
      - ./vaultwarden-data:/data
    ports:
      - "127.0.0.1:8000:80"
    networks: [vault]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]


  shopware:
    # The sdwa5.org shop, built from shopware/Dockerfile by tools/shopware/image.sh on the
    # workstation and loaded with `image.sh ship`. It is in no registry, so nothing may pull it.
    # The tag is the Shopware version and a build number, and this line is the only place that
    # names it (docs/shopware/image.md#tags). A new tag goes live only through
    # tools/shopware/deploy.sh, which runs the migrations before the switch.
    image: localhost/sdwa5-shopware:6.7.15.1-1
    pull_policy: never
    container_name: shopware
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - APP_URL=https://sdwa5.org
      # Caddy on the host terminates TLS. Only it reaches 8001, and it overwrites any
      # X-Forwarded-* a client sends, so the direct peer is trusted, whichever address the
      # image's own Caddy hands PHP (docs/shopware/image.md#proxy-headers).
      - SYMFONY_TRUSTED_PROXIES=REMOTE_ADDR
      - SHOPWARE_HTTP_DEFAULT_TTL=7200
      - SHOPWARE_ES_ENABLED=0
      - SHOPWARE_ES_INDEXING_ENABLED=0
      # Keeps Shopware AG's service apps out (SEC-29, 2026-10-17). The persisted
      # core.services.disabled flag already blocks every consent-bound service,
      # but SwagGmvReportingService requires only a Shopware account and the
      # daily services.install task would reinstall it. With this, that task
      # does nothing. POST /api/services/enable plus removing this line is the
      # way back.
      - ENABLE_SERVICES=false
      # FrankenPHP starts 2 x CPUs PHP threads at 512m each; 5 matches the FPM variant's default.
      - FRANKENPHP_CONFIG=num_threads 5
    logging: *default-logging
    volumes:
      - ./shopware-data/files:/var/www/html/files
      - ./shopware-data/media:/var/www/html/public/media
      - ./shopware-data/thumbnail:/var/www/html/public/thumbnail
      - ./shopware-data/sitemap:/var/www/html/public/sitemap
      - ./shopware-data/theme:/var/www/html/public/theme
      - ./shopware-data/log:/var/www/html/var/log
      - ./hardening/php/99-php-security-mitigation.ini:/usr/local/etc/php/conf.d/99-php-security-mitigation.ini:ro
    secrets:
      # APP_SECRET, INSTANCE_ID and DATABASE_URL, owner 82 (www-data), see docs/shopware/image.md#secrets.
      - source: shopware_env_local
        target: /var/www/html/.env.local
    depends_on: [shopware_db]
    restart: unless-stopped
    networks: [shop, shop_db]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  shopware_db:
    # MySQL 8.4 LTS, series pin like dolibarr_db. The shop moves here from dockware's MySQL 8.0
    # (EOL) with SEC-31. A major version upgrades the data files and is a one-way door.
    image: mysql:8.4
    container_name: shopware_db
    restart: unless-stopped
    command: ["--mysqlx=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/sdwa5-secrets/shopware_db_root_password
      MYSQL_DATABASE: shopware
      MYSQL_USER: shopware
      MYSQL_PASSWORD_FILE: /run/sdwa5-secrets/shopware_db_password
    logging: *default-logging
    volumes:
      - ./shopware-db-data:/var/lib/mysql
    secrets:
      - source: shopware_db_root_password
        target: /run/sdwa5-secrets/shopware_db_root_password
      - source: shopware_db_password
        target: /run/sdwa5-secrets/shopware_db_password
    # InnoDB flushes on SIGTERM; Docker's default 10 s would kill a slow shutdown (SEC-35).
    stop_grace_period: 60s
    networks: [shop_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  minecraft:
    # Not pinned. Profile-gated, the image is not even present on the host, so
    # there is no running digest to pin to, and the thing that actually decides
    # the server build is the VERSION environment variable below.
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    profiles: ["minecraft"]
    logging: *default-logging
    ports:
      - "25565:25565"
    environment:
      VERSION: "1.21.4"
      EULA: "TRUE"
      TYPE: "FABRIC"
      ONLINE_MODE: "true"
      DIFFICULTY: "3"
      OPS: |-
        bestcodename
        Boehmb0Ss
      EXISTING_OPS_FILE: "MERGE"
      # The list lives in minecraft/modrinth-mods.txt so that a disabled mod can
      # be commented out and stay visible. Blank lines and `#` comments are
      # ignored by the image. See docs/minecraft.md.
      MODRINTH_PROJECTS: "@/extras/modrinth-mods.txt"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      VERSION_FROM_MODRINTH_PROJECTS: "true" # not yet taking modloader type into account
      MEMORY: "5G"
      MOTD: "\u00a78\u00a7lSch\u00a78ei\u00a74\u00a7l\u00a7k\u00df\u00a78\u00a7l die Wand an \u00a74\u00a7l5\u00a7r\n\u00a78Free Teknology Sound System"
      ICON: "https://sdwa5.org/media/06/e8/9f/1759093654/Logo_neu.png"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Berlin"
      ENABLE_WHITELIST: "true"
      WHITELIST: |-
        bestcodename
        Boehmb0Ss
        DCXI
        NABI
      EXISTING_WHITELIST_FILE: "MERGE"
      PLAYER_IDLE_TIMEOUT: "10"
      LOG_TIMESTAMP: "true"
    volumes:
      - "./minecraft-data:/data"
      # Read-only, and outside /data on purpose: this is repository-owned
      # configuration rather than server state.
      - "./minecraft/modrinth-mods.txt:/extras/modrinth-mods.txt:ro"
    restart: unless-stopped
    networks: [minecraft]





  dolibarr_db:
    # Minor-series pin, not exact. Patch updates inside 12.3 are safe and
    # wanted; crossing a major version under Dolibarr is the hazard, and it is a
    # one-way door. Measured 2026-09-08: `latest`, `lts`, `12` and `12.3` all
    # pointed at the same digest, so `latest` is 12.3 today and would follow
    # to 13 on its own.
    image: mariadb:12.3
    container_name: dolibarr_db
    restart: unless-stopped
    environment:
      # Secrets are files, see the top-level secrets: block. The entrypoint's
      # file_env reads them, and monitoring/database-backup.sh reads
      # MYSQL_PASSWORD_FILE itself.
      MYSQL_ROOT_PASSWORD_FILE: /run/sdwa5-secrets/dolibarr_db_root_password
      MYSQL_DATABASE: ${DOLIBARR_MYSQL_DATABASE:-dolidb}
      MYSQL_USER: ${DOLIBARR_MYSQL_USER:-dolidbuser}
      MYSQL_PASSWORD_FILE: /run/sdwa5-secrets/dolibarr_db_password
      # Without it the entrypoint skips mariadb-upgrade after a version bump, and
      # the stale mysql.proc of the 11.8 to 12.3 jump broke `mariadb-dump
      # --routines` until 2026-10-15. The upgrade runs with grants off, so it
      # needs no root login, and it backs up the mysql schema into the datadir first.
      MARIADB_AUTO_UPGRADE: "1"
    logging: *default-logging
    volumes:
      - ./dolibarr-mariadb-data:/var/lib/mysql
    secrets:
      - source: dolibarr_db_root_password
        target: /run/sdwa5-secrets/dolibarr_db_root_password
      - source: dolibarr_db_password
        target: /run/sdwa5-secrets/dolibarr_db_password
    # The internal network has no gateway, so the database can neither be
    # reached from nor reach anything outside the ERP.
    networks: [erp_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  dolibarr:
    # Exact pin for the planned maintenance release. A Dolibarr minor
    # upgrade runs forward-only database migrations. Restore drills passed on
    # 2026-10-15, but an update remains a deliberate bump rather than whatever a
    # pull happens to fetch. The `24` tag exists and would allow 24.x to move
    # on its own, which is why it is not used. The PHP variant and the digest
    # are part of the pin, because upstream rebuilds tags and moved the plain
    # `24.0.2` from PHP 8.2 to 8.5 on 2026-10-24. This build ships PHP 8.5.12.
    image: dolibarr/dolibarr:24.0.2-php8.5@sha256:46c066a954179e31b1d139d8e315162cf8ab72a6f6ae14add89622fd0457eff0
    container_name: dolibarr
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      start_period: 300s
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DOLI_INIT_DEMO: ${DOLIBARR_INIT_DEMO:-0}
      DOLI_DB_HOST: dolibarr_db
      DOLI_DB_NAME: ${DOLIBARR_MYSQL_DATABASE:-dolidb}
      DOLI_DB_USER: ${DOLIBARR_MYSQL_USER:-dolidbuser}
      # Secrets are files, see the top-level secrets: block. The image's
      # get_env_value reads *_FILE into a shell variable that Apache does not
      # inherit, so the values stay out of PHP's environment as well.
      DOLI_DB_PASSWORD_FILE: /run/sdwa5-secrets/dolibarr_db_password
      DOLI_URL_ROOT: "https://erp.sdwa5.org"
      DOLI_ADMIN_LOGIN: "${DOLIBARR_ADMIN_LOGIN:-admin}"
      # Read only when the schema is empty. A random value, not the live admin
      # password, so an accidental empty init gets an unknown password instead
      # of the image default `admin`. See docs/dolibarr.md.
      DOLI_ADMIN_PASSWORD_FILE: /run/sdwa5-secrets/dolibarr_admin_init_password
      DOLI_CRON: 0
      DOLI_CRON_USER: "${DOLIBARR_ADMIN_LOGIN:-admin}"
      DOLI_CRON_KEY_FILE: /run/sdwa5-secrets/dolibarr_cron_key
      DOLI_COMPANY_NAME: ${DOLIBARR_COMPANY_NAME:-SdWa5}
      WWW_USER_ID: ${DOLIBARR_WWW_USER_ID:-1000}
      WWW_GROUP_ID: ${DOLIBARR_WWW_GROUP_ID:-1000}
    ports:
      - "127.0.0.1:8002:80"
    networks: [erp, erp_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./dolibarr-documents-data:/var/www/documents
      - ./dolibarr-custom-data:/var/www/html/custom
      # Credentials of custom modules, such as BankSync's paypal.json. A directory rather than a
      # file, because Docker creates a missing file mount as an empty directory. Kept out of the
      # database and its dumps on purpose, see docs/dolibarr.md.
      - ./dolibarr-secrets:/run/secrets:ro
      - ./hardening/php/99-php-security-mitigation.ini:/usr/local/etc/php/conf.d/99-php-security-mitigation.ini:ro
    secrets:
      - source: dolibarr_db_password
        target: /run/sdwa5-secrets/dolibarr_db_password
      - source: dolibarr_admin_init_password
        target: /run/sdwa5-secrets/dolibarr_admin_init_password
      - source: dolibarr_cron_key
        target: /run/sdwa5-secrets/dolibarr_cron_key

  dolibarr_cron:
    # Exact pin for the planned maintenance release. A Dolibarr minor
    # upgrade runs forward-only database migrations. Restore drills passed on
    # 2026-10-15, but an update remains a deliberate bump rather than whatever a
    # pull happens to fetch. The `24` tag exists and would allow 24.x to move
    # on its own, which is why it is not used. The PHP variant and the digest
    # are part of the pin, because upstream rebuilds tags and moved the plain
    # `24.0.2` from PHP 8.2 to 8.5 on 2026-10-24. This build ships PHP 8.5.12.
    image: dolibarr/dolibarr:24.0.2-php8.5@sha256:46c066a954179e31b1d139d8e315162cf8ab72a6f6ae14add89622fd0457eff0
    container_name: dolibarr_cron
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      dolibarr:
        condition: service_healthy
    environment:
      DOLI_INIT_DEMO: ${DOLIBARR_INIT_DEMO:-0}
      DOLI_DB_HOST: dolibarr_db
      DOLI_DB_NAME: ${DOLIBARR_MYSQL_DATABASE:-dolidb}
      DOLI_DB_USER: ${DOLIBARR_MYSQL_USER:-dolidbuser}
      # conf.php is written at container creation, so the cron container needs
      # the database password too. DOLI_CRON=1 skips the database init, so it
      # gets no admin password at all.
      DOLI_DB_PASSWORD_FILE: /run/sdwa5-secrets/dolibarr_db_password
      DOLI_URL_ROOT: "https://erp.sdwa5.org"
      DOLI_ADMIN_LOGIN: "${DOLIBARR_ADMIN_LOGIN:-admin}"
      DOLI_CRON: 1
      DOLI_CRON_USER: "${DOLIBARR_ADMIN_LOGIN:-admin}"
      DOLI_CRON_KEY_FILE: /run/sdwa5-secrets/dolibarr_cron_key
      DOLI_COMPANY_NAME: ${DOLIBARR_COMPANY_NAME:-SdWa5}
      WWW_USER_ID: ${DOLIBARR_WWW_USER_ID:-1000}
      WWW_GROUP_ID: ${DOLIBARR_WWW_GROUP_ID:-1000}
    networks: [erp, erp_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./dolibarr-documents-data:/var/www/documents
      - ./dolibarr-custom-data:/var/www/html/custom
      # Credentials of custom modules, such as BankSync's paypal.json. A directory rather than a
      # file, because Docker creates a missing file mount as an empty directory. Kept out of the
      # database and its dumps on purpose, see docs/dolibarr.md.
      - ./dolibarr-secrets:/run/secrets:ro
      - ./hardening/php/99-php-security-mitigation.ini:/usr/local/etc/php/conf.d/99-php-security-mitigation.ini:ro
    secrets:
      - source: dolibarr_db_password
        target: /run/sdwa5-secrets/dolibarr_db_password
      - source: dolibarr_cron_key
        target: /run/sdwa5-secrets/dolibarr_cron_key

  paperless_sdwa5_db:
    # Same minor-series pin as dolibarr_db, for the same reason. The `_db`
    # suffix is what makes monitoring/database-backup.sh dump it as MariaDB.
    image: mariadb:12.3
    container_name: paperless_sdwa5_db
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=64M"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/sdwa5-secrets/paperless_sdwa5_db_root_password
      MYSQL_DATABASE: paperless
      MYSQL_USER: paperless
      MYSQL_PASSWORD_FILE: /run/sdwa5-secrets/paperless_sdwa5_db_password
      MARIADB_AUTO_UPGRADE: "1"
    logging: *default-logging
    volumes:
      - ./paperless-sdwa5-mariadb-data:/var/lib/mysql
    secrets:
      - source: paperless_sdwa5_db_root_password
        target: /run/sdwa5-secrets/paperless_sdwa5_db_root_password
      - source: paperless_sdwa5_db_password
        target: /run/sdwa5-secrets/paperless_sdwa5_db_password
    networks: [paper_sdwa5_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  paperless_sdwa5_broker:
    # Exact tag. Celery's queue only, kept in memory without a volume, so a
    # restart loses at most the tasks still queued.
    image: valkey/valkey:9.1-alpine
    container_name: paperless_sdwa5_broker
    restart: unless-stopped
    logging: *default-logging
    networks: [paper_sdwa5_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  paperless_sdwa5:
    # Exact tag plus digest. 3.3.2 of 2026-10-16 fixes GHSA-c8f3-pqr2-rr24, and
    # a Paperless minor runs forward-only migrations, so an update is a
    # deliberate bump of this one anchor, which paperless_home reuses.
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.2@sha256:d232cba37cc0bab0d6c6581ecd320383b7a6f49f33e0fd16adda4d009eb600dd
    container_name: paperless_sdwa5
    restart: unless-stopped
    logging: *default-logging
    depends_on: [paperless_sdwa5_db, paperless_sdwa5_broker]
    healthcheck:
      test: ["CMD", "curl", "-fs", "--max-time", "5", "http://127.0.0.1:8000"]
      start_period: 300s
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: *paperless-env
      PAPERLESS_URL: https://paper.sdwa5.org
      PAPERLESS_COOKIE_PREFIX: sdwa5
      # The image's init-env-file copies PAPERLESS_*_FILE into the s6 container
      # environment, so the values leave docker inspect but every Paperless
      # process still carries them. See docs/paperless.md.
      PAPERLESS_SECRET_KEY_FILE: /run/sdwa5-secrets/paperless_sdwa5_secret_key
      PAPERLESS_DBHOST: paperless_sdwa5_db
      PAPERLESS_DBPASS_FILE: /run/sdwa5-secrets/paperless_sdwa5_db_password
      PAPERLESS_REDIS: redis://paperless_sdwa5_broker:6379
    ports:
      - "127.0.0.1:8006:8000"
    volumes:
      - ./paperless-sdwa5-data:/usr/src/paperless/data
      - ./paperless-sdwa5-media:/usr/src/paperless/media
    secrets:
      - source: paperless_sdwa5_secret_key
        target: /run/sdwa5-secrets/paperless_sdwa5_secret_key
      - source: paperless_sdwa5_db_password
        target: /run/sdwa5-secrets/paperless_sdwa5_db_password
    networks: [paper_sdwa5, paper_sdwa5_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  # The household instance. A second instance rather than more users in the
  # first, because a Paperless superuser sees every object and the Verein's
  # admins must never see private documents. See docs/paperless.md.
  paperless_home_db:
    image: mariadb:12.3
    container_name: paperless_home_db
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=64M"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/sdwa5-secrets/paperless_home_db_root_password
      MYSQL_DATABASE: paperless
      MYSQL_USER: paperless
      MYSQL_PASSWORD_FILE: /run/sdwa5-secrets/paperless_home_db_password
      MARIADB_AUTO_UPGRADE: "1"
    logging: *default-logging
    volumes:
      - ./paperless-home-mariadb-data:/var/lib/mysql
    secrets:
      - source: paperless_home_db_root_password
        target: /run/sdwa5-secrets/paperless_home_db_root_password
      - source: paperless_home_db_password
        target: /run/sdwa5-secrets/paperless_home_db_password
    networks: [paper_home_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  paperless_home_broker:
    image: valkey/valkey:9.1-alpine
    container_name: paperless_home_broker
    restart: unless-stopped
    logging: *default-logging
    networks: [paper_home_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  paperless_home:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.2@sha256:d232cba37cc0bab0d6c6581ecd320383b7a6f49f33e0fd16adda4d009eb600dd
    container_name: paperless_home
    restart: unless-stopped
    logging: *default-logging
    depends_on: [paperless_home_db, paperless_home_broker]
    healthcheck:
      test: ["CMD", "curl", "-fs", "--max-time", "5", "http://127.0.0.1:8000"]
      start_period: 300s
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: *paperless-env
      PAPERLESS_URL: https://paper.ripper.sdwa5.org
      PAPERLESS_COOKIE_PREFIX: home
      # The image's init-env-file copies PAPERLESS_*_FILE into the s6 container
      # environment, so the values leave docker inspect but every Paperless
      # process still carries them. See docs/paperless.md.
      PAPERLESS_SECRET_KEY_FILE: /run/sdwa5-secrets/paperless_home_secret_key
      PAPERLESS_DBHOST: paperless_home_db
      PAPERLESS_DBPASS_FILE: /run/sdwa5-secrets/paperless_home_db_password
      PAPERLESS_REDIS: redis://paperless_home_broker:6379
    ports:
      - "127.0.0.1:8007:8000"
    volumes:
      - ./paperless-home-data:/usr/src/paperless/data
      - ./paperless-home-media:/usr/src/paperless/media
    secrets:
      - source: paperless_home_secret_key
        target: /run/sdwa5-secrets/paperless_home_secret_key
      - source: paperless_home_db_password
        target: /run/sdwa5-secrets/paperless_home_db_password
    networks: [paper_home, paper_home_db]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]

  ollama:
    # Not pinned. Profile-gated and the image is not present on the host.
    image: ollama/ollama:latest
    profiles: ["ollama"]
    logging: *default-logging
    ports:
      # Loopback only. Ollama has no authentication of any kind, so an
      # all-interfaces publish would be an open model server on a public VPS.
      # The host firewall cannot save this: a published port is DNAT'd and
      # traverses FORWARD, where DOCKER-USER is an empty pass-through, so the
      # INPUT DROP policy never sees it. See docs/ssh-hardening.md.
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    networks: [ollama]

  restic:
    # Exact, and only for the restic, rclone, crond and flock it ships; the
    # schedule and the backup run are restic/entrypoint.sh and restic/backup.sh.
    # 0.33.1-amd64 measured 2026-10-15: restic 0.19.1, rclone 1.75.2, built
    # 2026-10-11. `latest` is rebuilt weekly, so it is not used. Until
    # 2026-10-15 this was lobaro/restic-backup-docker:latest, last pushed
    # 2021-05-05 with restic 0.12.0. The repository stays at format version 1,
    # which every restic since 0.9 reads; do not run `restic migrate` without a
    # decision. See docs/backup.md.
    image: creativeprojects/resticprofile:0.33.1-amd64
    container_name: restic
    entrypoint: ["/bin/sh", "/opt/restic/entrypoint.sh"]
    restart: unless-stopped
    # restic records os.Hostname() on every snapshot, which in a container is
    # the container ID, and `restic forget` groups by `host,paths` by default.
    # So each recreation of this container started a fresh retention group with
    # its own full allowance. Measured 2026-09-08: 11 distinct hostnames across
    # 61 snapshots, where one group would hold 17. Pinning the hostname makes
    # the retention policy mean what it says from here on. See docs/backup.md.
    hostname: sdwa5-vps
    # lobaro's PID 1 was `tail -fn0 /var/log/cron.log`, which never reaped
    # children, so every rclone process a backup run spawned became a zombie.
    # Measured 108 of them on 2026-09-08 after 51 days up. An init reaps them
    # and stays, so the reaping does not depend on what the entrypoint runs.
    init: true
    logging: *default-logging
    volumes:
      - ./rclone-config:/root/.config/rclone
      - ./restic:/opt/restic:ro
      - ./:/data:ro
    environment:
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-rclone:sdwa5backup:restic-backups}
      # The remote sdwa5backup is defined here rather than in rclone.conf. It is
      # the service account restic-backup, whose only Drive access is
      # membership of the Shared Drive "SdWa5 Backup". Its key is
      # rclone-config/restic-sa.json, mode 600. The drive ID stays in .env.
      # The former remote [SdWa5] was an OAuth token with scope `drive` on the
      # owner's whole Drive, revoked on 2026-10-15. See docs/backup.md.
      - RCLONE_CONFIG_SDWA5BACKUP_TYPE=drive
      - RCLONE_CONFIG_SDWA5BACKUP_SCOPE=drive
      - RCLONE_CONFIG_SDWA5BACKUP_SERVICE_ACCOUNT_FILE=/root/.config/rclone/restic-sa.json
      - RCLONE_CONFIG_SDWA5BACKUP_TEAM_DRIVE=${RESTIC_SHARED_DRIVE_ID:-}
      # restic reads the file itself, and busybox crond hands this variable to
      # restic/backup.sh, so the password is in no process environment.
      - RESTIC_PASSWORD_FILE=/run/sdwa5-secrets/restic_password
      # Daily, and this is 04:00 UTC rather than local: no TZ is set here, so
      # the container runs UTC and the job lands at 06:00 CEST / 05:00 CET.
      # monitoring/vaultwarden-db-backup.sh is host cron and therefore Berlin
      # time, so the two are 2h10m apart rather than the 10 minutes the docs
      # used to claim. See docs/backup.md.
      - BACKUP_CRON=0 4 * * *
      # What restic/backup.sh backs up. lobaro's BACKUP_DIRS was never read,
      # its script hard-coded /data as well.
      - BACKUP_PATH=/data
      - RCLONE_CONFIG=/root/.config/rclone/rclone.conf
      # --keep-tag keeps every archive snapshot, which holds host files that
      # were deleted after it was taken. See docs/backup.md.
      - RESTIC_FORGET_ARGS=--keep-daily 6 --keep-weekly 3 --keep-monthly 11 --keep-yearly 2 --keep-tag sdwa5-archive --prune
    networks: [backup]
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: restic_password
        target: /run/sdwa5-secrets/restic_password

# Credentials as files instead of values interpolated from .env, so they appear
# neither in `docker inspect` nor in `docker compose config`. Each file lives in
# /opt/docker/secrets/ (directory 700, files 400, root, no trailing newline,
# gitignored) and is bind-mounted read-only at /run/sdwa5-secrets/<name>, not
# /run/secrets, because the Dolibarr services mount dolibarr-secrets there.
# Which image reads which *_FILE, and where a value still ends up in a process
# environment, is in docs/infrastructure.md.
secrets:
  dolibarr_db_root_password:
    file: ./secrets/dolibarr_db_root_password
  dolibarr_db_password:
    file: ./secrets/dolibarr_db_password
  dolibarr_admin_init_password:
    file: ./secrets/dolibarr_admin_init_password
  dolibarr_cron_key:
    file: ./secrets/dolibarr_cron_key
  paperless_sdwa5_db_root_password:
    file: ./secrets/paperless_sdwa5_db_root_password
  paperless_sdwa5_db_password:
    file: ./secrets/paperless_sdwa5_db_password
  paperless_sdwa5_secret_key:
    file: ./secrets/paperless_sdwa5_secret_key
  paperless_home_db_root_password:
    file: ./secrets/paperless_home_db_root_password
  paperless_home_db_password:
    file: ./secrets/paperless_home_db_password
  paperless_home_secret_key:
    file: ./secrets/paperless_home_secret_key
  restic_password:
    file: ./secrets/restic_password
  shopware_db_root_password:
    file: ./secrets/shopware_db_root_password
  shopware_db_password:
    file: ./secrets/shopware_db_password
  shopware_env_local:
    file: ./secrets/shopware_env_local

# One network per application instead of the shared default. Until 2026-10-15
# every container sat on docker_default, and chimodiazz_shopware could open
# shopware:3306, dolibarr_db:3306, vaultwarden:80 and dolibarr:80 by name.
# Docker isolates user-defined bridges from each other, so a container now
# reaches only its own application. Caddy is unaffected, because it runs on the
# host and uses the loopback ports. Measured 2026-10-15: a container cannot
# reach another network's loopback publish through its gateway either, since
# those listeners are bound to 127.0.0.1. See docs/infrastructure.md.
networks:
  vault:
  shop:
  shop_db:
    internal: true
  erp:
  erp_db:
    internal: true
  backup:
  minecraft:
  ollama:
  paper_sdwa5:
  paper_sdwa5_db:
    internal: true
  paper_home:
  paper_home_db:
    internal: true
