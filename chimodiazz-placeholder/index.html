<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chimo Diazz</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f3;
    --fg: #16161a;
    --muted: #5d5d66;
    --rule: #d8d6d1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --fg: #f2f1ee; --muted: #9a9aa4; --rule: #2c2c33; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 400 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; width: 100%; }
  h1 {
    margin: 0 0 1.5rem;
    font-size: clamp(2rem, 8vw, 3.25rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 1.75rem 0; }
  p { margin: 0 0 0.75rem; }
  .muted { color: var(--muted); }
  a { color: inherit; }
  footer { margin-top: 2.5rem; font-size: 0.875rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Chimo Diazz</h1>
  <p lang="de">Die neue Website wird gerade gebaut. Sie erscheint in Kürze an dieser Stelle.</p>
  <p lang="de" class="muted">Bis dahin erreichst du uns per E-Mail.</p>
  <hr>
  <p lang="en">The new site is being built. It will appear here shortly.</p>
  <p lang="en" class="muted">Until then, email is the way to reach us.</p>
  <footer>
    <p><a href="mailto:mail@sdwa5.org">mail@sdwa5.org</a></p>
  </footer>
</main>
</body>
</html>
